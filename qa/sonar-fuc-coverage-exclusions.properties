# Fuente única FUC: misma lista que sonar-project.properties_fuc (propiedad sonar.coverage.exclusions).
# Política aprobada: wiring Go (cmd, db, platform, http), capas por nombre (repository/models/dto/route),
# UI compartida (components/ui, components/shared), hooks React Query, drawers, barrels index.ts,
# tipos/constantes/schemas, layout/providers Next e instrumentación.
sonar.coverage.exclusions=**/repository.go,**/models.go,**/dto.go,**/route.go,**/cmd/**,**/internal/db/**,**/internal/platform/**,**/internal/http/**,**/types/**,**/*.types.ts,**/app/layout.tsx,**/providers.tsx,**/*.constants.ts,**/*.schema.ts,**/components/ui/**,**/components/shared/**,**/hooks/**,**/drawers/**,**/index.ts,**/instrumentation.ts,**/middleware.ts,**/proxy.ts
