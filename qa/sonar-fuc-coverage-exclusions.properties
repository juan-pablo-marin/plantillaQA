# Fuente única FUC — métrica representativa (criterio típico fábrica software):
# - Excluir solo capas finas Go (repository/models/dto/route), punto de entrada cmd, persistencia db,
#   plataforma, barrilles index.ts, definiciones *.types.ts, glue Next (layout raíz, providers,
#   instrumentation, middleware, proxy).
# - NO se excluye UI compartida, hooks, drawers, schemas Zod, constantes ni internal/http:
#   esa lógica cuenta para cobertura y debe cubrirse con tests.
# - internal/testutil/: mocks compartidos solo para tests Go (no código de producto).
sonar.coverage.exclusions=**/repository.go,**/models.go,**/dto.go,**/route.go,**/cmd/**,**/internal/db/**,**/internal/platform/**,**/internal/testutil/**,**/*.types.ts,**/app/**/layout.tsx,**/providers.tsx,**/index.ts,**/instrumentation.ts,**/middleware.ts,**/proxy.ts
